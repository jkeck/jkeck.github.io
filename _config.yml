# Site identity
title: Jessie Keck
subtitle: "engineering manager · field notes from the working journal"
description: "Engineering manager, formerly engineer. Writing about software, systems, and side projects."
url: "https://jessiekeck.com"
baseurl: ""

# Contact
email: info@jessiekeck.com
github: jkeck
linkedin: jessiekeck

# Build settings
markdown: kramdown
permalink: pretty

plugins:
  - jekyll-sitemap

# Arcade easter egg config
arcade:
  transition: crt   # crt | pixel

# Dev-only files — not copied into _site/
exclude:
  - node_modules
  - test
  - supabase
  - scripts
  - package.json
  - package-lock.json
  - tsconfig.json
  - vitest.config.js
