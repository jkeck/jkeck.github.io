name: CI
on:
  pull_request:
  push:
    branches: [master, 'worktree-*']
jobs:
  unit:
    name: Unit tests + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  # integration job added in Slice 1 — requires Docker + supabase start
